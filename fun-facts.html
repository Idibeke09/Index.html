<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Fun Facts</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .fact-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 10px;
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
            line-height: 1.6;
            margin-bottom: 30px;
            transition: all 0.3s ease;
        }

        .fact-box:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .reset-btn {
            background: #f093fb;
        }

        .reset-btn:hover {
            background: #e072da;
        }

        .fact-counter {
            color: #666;
            font-size: 0.9em;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎉 Random Fun Facts</h1>
        <div class="fact-box" id="factBox">
            Click the button below to discover an amazing fun fact!
        </div>
        <div class="button-group">
            <button onclick="showRandomFact()">Get Random Fact</button>
            <button class="reset-btn" onclick="resetPage()">Reset</button>
        </div>
        <div class="fact-counter">
            <span id="factCount">0</span> facts viewed
        </div>
    </div>

    <script>
        const funFacts = [
            "🐙 Octopuses have three hearts! Two pump blood to the gills, while the third pumps it to the rest of the body.",
            "🍯 Honey never spoils. Archaeologists have found 3,000-year-old honey in Egyptian tombs that was still edible!",
            "🦷 A shark can regenerate up to 30,000 teeth in a lifetime.",
            "☁️ Clouds weigh millions of pounds, yet they float because the air currents are strong enough to support them.",
            "🌟 A day on Venus is longer than a year on Venus.",
            "🧠 Your brain uses 20% of your body's energy, despite being only 2% of your body's weight.",
            "🦗 Crickets' ears are located on their legs, not their heads!",
            "💎 Diamonds rain on Jupiter and Saturn.",
            "🐢 Tortoises can hold their breath for up to 7 hours.",
            "🌙 The Moon is slowly moving away from Earth at a rate of 1.6 inches per year.",
            "🐠 Goldfish have a memory span of about 3 seconds.",
            "🦌 Reindeer eyes glow in the dark to help them see in the dark Arctic nights.",
            "🌽 Honey is the only food that doesn't go bad and can last for thousands of years.",
            "🦋 A butterfly's taste buds are on its feet.",
            "🎪 Bananas are berries, but strawberries aren't!",
            "🐌 Snails can sleep for up to 3 years.",
            "🦅 An eagle can see a fish in the water from a height of 10,000 feet.",
            "🍓 Strawberries are the only fruit with seeds on the outside.",
            "🧂 Sea otters hold hands while sleeping so they don't drift apart.",
            "🌈 A group of flamingos is called a 'flamboyance'.",
            "🐢 Some turtles can breathe through their butts!",
            "👅 Your tongue print is unique, like a fingerprint.",
            "🌊 Octopuses have blue blood!",
            "🦴 Your bones are stronger than steel, ounce for ounce.",
            "⚡ Lightning can reach temperatures of 53,000°F, hotter than the surface of the sun.",
            "🐒 Humans and bananas share 50-60% of their DNA.",
            "🦉 Owls can rotate their heads up to 270 degrees.",
            "🌻 Sunflowers can track the sun across the sky during the day.",
            "🐘 Elephants can recognize themselves in a mirror.",
            "🎵 Music can increase plant growth by up to 25%!"
        ];

        let factsViewed = 0;
        let usedFacts = new Set();

        function showRandomFact() {
            let randomIndex;
            
            // If all facts have been used, reset the used facts set
            if (usedFacts.size === funFacts.length) {
                usedFacts.clear();
            }
            
            // Get a random fact that hasn't been shown recently
            do {
                randomIndex = Math.floor(Math.random() * funFacts.length);
            } while (usedFacts.has(randomIndex));
            
            usedFacts.add(randomIndex);
            const fact = funFacts[randomIndex];
            const factBox = document.getElementById('factBox');
            
            // Add animation effect
            factBox.style.opacity = '0';
            setTimeout(() => {
                factBox.textContent = fact;
                factBox.style.opacity = '1';
            }, 300);
            
            factsViewed++;
            updateCounter();
        }

        function updateCounter() {
            document.getElementById('factCount').textContent = factsViewed;
        }

        function resetPage() {
            factsViewed = 0;
            usedFacts.clear();
            document.getElementById('factBox').textContent = 'Click the button below to discover an amazing fun fact!';
            updateCounter();
        }

        // Add CSS transition for smooth fade effect
        const style = document.createElement('style');
        style.textContent = `
            #factBox {
                transition: opacity 0.3s ease;
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
